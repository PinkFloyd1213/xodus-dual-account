# Daily: keep main equal to xodus-gaming/xodus so the commit pinned by the
# Nexus dual-account lock (repository = this fork) is always fetchable.
name: Upstream mirror

on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - env:
          # Needs a token with Workflows write when upstream edits .github/workflows.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
