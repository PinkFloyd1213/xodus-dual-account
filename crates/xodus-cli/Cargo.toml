[package]
name = "xodus-cli"
version = "0.1.0"
edition = "2024"
default-run = "xodus-cli"

[dependencies]
xodus = { path = "../xodus" }
msixvc = { path = "../msixvc" }
eappx = { git = "https://github.com/tuxuser/eappx-rs" }
base64 = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
tao = { version = "0.37.0", optional = true }
wry = { version = "0.56.1", optional = true }
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
chrono = { workspace = true }
inquire = "0.9.4"
futures-util = "0.3.34"
uuid = "1.25.0"
indicatif = "0.18.6"
fs2 = "0.4.3"
tempfile = "3.27.0"
rustix = "1.1.4"
ctrlc = "3.5.2"
nix = "0.31.3"

[features]
default = ["native-webview"]
native-webview = ["dep:tao", "dep:wry"]
tokio_console = ["dep:console-subscriber"]
